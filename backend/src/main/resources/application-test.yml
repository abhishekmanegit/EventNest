# Test profile: Flyway runs for real against a Testcontainers PostgreSQL, because
# H2 does not enforce the UNIQUE / CHECK / TEXT[] / JSONB semantics that this
# product's correctness guarantees depend on.
#
# "The test passed" has to mean "it works in production", so we test on Postgres.
spring:
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  notifications:
    enabled: false
  seed:
    enabled: false

logging:
  level:
    com.eventnest: INFO
    org.springframework.test: INFO
    org.testcontainers: INFO
