server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # Backend API + Swagger UI are proxied (the frontend only ever talks to /api).
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 6m;
    }

    # Health endpoint used by the container healthcheck.
    location = /healthz {
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # SPA: serve static assets verbatim, everything else falls back to index.html.
    location /assets/ {
        try_files $uri =404;
    }
    location / {
        try_files $uri /index.html;
    }

    # Never cache hashed assets; index.html must be fresh (it references new hashes).
    location /index.html {
        add_header Cache-Control "no-store";
    }
}